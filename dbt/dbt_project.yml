name: tavle
version: "0.1"
profile: tavle
model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]
vars:
  raw_path: "../data/raw"
models:
  tavle:
    staging:
      # tables rather than views on purpose: a view over read_parquet keeps a
      # relative path inside its definition, so the warehouse only works from
      # the directory dbt happened to run in. Materialising cuts the path
      # dependency and every downstream tool can open the file from anywhere.
      +materialized: table
    marts:
      +materialized: table
