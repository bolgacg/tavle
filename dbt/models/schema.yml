version: 2
models:
  - name: stg_elspot
    columns:
      - name: area
        data_tests: [not_null, {accepted_values: {arguments: {values: ['DK1', 'DK2']}}}]
      - name: interval_start_utc
        data_tests: [not_null]
      - name: price_eur
        data_tests: [not_null]
    data_tests:
      - unique:
          arguments:
            column_name: "area || '|' || interval_start_utc"
  - name: stg_dayahead
    columns:
      - name: area
        data_tests: [not_null, {accepted_values: {arguments: {values: ['DK1', 'DK2']}}}]
      - name: interval_start_utc
        data_tests: [not_null]
      - name: price_eur
        data_tests: [not_null]
    data_tests:
      - unique:
          arguments:
            column_name: "area || '|' || interval_start_utc"
  - name: stg_fx
    columns:
      - name: rate_date
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null, {accepted_values: {arguments: {values: ['DKK', 'USD']}}}]
      - name: rate
        data_tests: [not_null]
    data_tests:
      - unique:
          arguments:
            column_name: "currency || '|' || rate_date"
  - name: prices
    columns:
      - name: instrument
        data_tests: [not_null, {accepted_values: {arguments: {values: ['DK1_DA', 'DK2_DA', 'EURDKK', 'EURUSD']}}}]
      - name: value
        data_tests: [not_null]
    data_tests:
      - unique:
          arguments:
            column_name: "instrument || '|' || interval_start_utc"
  - name: power_hourly
    data_tests:
      - unique:
          arguments:
            column_name: "area || '|' || hour_utc"
  - name: desk_daily
    data_tests:
      - unique:
          arguments:
            column_name: "area || '|' || day_dk"
  - name: stg_production
    columns:
      - name: area
        data_tests: [not_null, {accepted_values: {arguments: {values: ['DK1', 'DK2']}}}]
      - name: hour_utc
        data_tests: [not_null]
      - name: consumption_mwh
        data_tests: [not_null]
    data_tests:
      - unique:
          arguments:
            column_name: "area || '|' || hour_utc"
  - name: power_context
    data_tests:
      - unique:
          arguments:
            column_name: "area || '|' || hour_utc"
